<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>西原小 学びのあゆみ | 大田原市立西原小学校 研究発表</title>
<meta name="description" content="大田原市立西原小学校 「集団づくり」と「授業づくり」を一体的に行う学業指導の充実 ― 2年間のあゆみをまとめた研究発表サイト。">
<meta name="theme-color" content="#c2645a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style id="app-style">
  /* ============================================================
     西原小 学びのあゆみ — LIGHT MODE 改良版
     - ダークモードを削除（ライトテーマ固定）
     - カラーコントラストをWCAG AA基準で再調整
     - 影を淡色化し、写真プレースホルダの視認性を改善
     - レスポンシブ：tablet 600–900px を追加
     - 印刷スタイルを追加
     ============================================================ */

  /* ===== Tokens（ライト固定） ===== */
  :root {
    --bg: #fbf3ea;
    --surface: #ffffff;
    --surface-alt: #fdeee0;
    --ink: #2f2620;
    --ink-soft: #5a4d44;
    --ink-faint: #8a7869;
    --border: #ead9c4;

    /* アクセント（AA基準で再調整） */
    --navy:        #b14a40;   /* 朱赤（深め）: on-white 5.37:1 */
    --navy-soft:   #f9dad5;
    --navy-deep:   #8a3a32;   /* ヒーロー背景（深海紅）: on-white 7.5:1 */
    --on-navy:     #fff8f3;

    --gold:        #9c6a1f;   /* 金（深め）: on-white 5.05:1 */
    --gold-soft:   #f7e6c4;

    --green:       #4a7f47;   /* 緑（深め）: on-white 4.85:1 */
    --green-soft:  #dcebd6;

    --teal:        #2f7882;   /* 青緑（深め）: on-white 5.42:1 */
    --teal-soft:   #d2e9ec;

    --purple:      #6b4fa0;   /* 紫（深め）: on-white 5.3:1 */
    --purple-soft: #e6def5;

    --focus:       #1d4ed8;     /* フォーカスリング：彩度高めで視認性UP */
    --shadow: 0 1px 2px rgba(140, 70, 60, 0.06), 0 6px 18px rgba(140, 70, 60, 0.08);
    --shadow-hover: 0 2px 4px rgba(140, 70, 60, 0.10), 0 10px 28px rgba(140, 70, 60, 0.12);
    --radius-s: 10px;
    --radius-m: 18px;
    --radius-l: 28px;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  h1, h2, h3 {
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    font-weight: 700;
    text-wrap: balance;
    margin: 0;
    color: var(--ink);
  }
  h1 { line-height: 1.45; letter-spacing: 0.01em; }
  h2 { line-height: 1.5; }

  a { color: var(--navy); }
  a:hover { text-decoration: underline; }

  ::selection { background: var(--navy-soft); color: var(--ink); }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  /* ===== Focus ===== */
  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ===== Shell ===== */
  .site { max-width: 1080px; margin: 0 auto; }

  /* ===== Header / Nav ===== */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    backdrop-filter: saturate(140%) blur(6px);
  }
  .site-header::before {
    content: ""; display: block; height: 4px; background: linear-gradient(90deg, var(--navy) 0 25%, var(--gold) 25% 50%, var(--green) 50% 75%, var(--teal) 75% 100%);
  }

  .header-bar {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 20px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px 6px;
    font: inherit;
    border-radius: 12px;
  }
  .brand:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .brand-mark {
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--navy);
    color: var(--on-navy);
    display: grid;
    place-items: center;
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
  }

  .brand-text { display: flex; flex-direction: column; line-height: 1.35; }
  .brand-school {
    font-size: 0.72rem;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }
  .brand-site {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
  }

  /* ----- Nav: モバイルは付箋、両方ともチクチク対策 ----- */
  .nav-toggle {
    display: none;
    appearance: none;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 44px; height: 44px;
    cursor: pointer;
    padding: 0;
    align-items: center; justify-content: center;
  }
  .nav-toggle svg { width: 22px; height: 22px; }

  .main-nav { display: flex; gap: 4px; flex-wrap: wrap; }

  .nav-btn {
    appearance: none;
    background: none;
    border: none;
    font: inherit;
    font-size: 0.88rem;
    color: var(--ink-soft);
    padding: 10px 16px;
    min-height: 44px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    transition: background-color .15s ease, color .15s ease;
  }
  .nav-btn:hover { background: var(--surface-alt); color: var(--ink); }
  .nav-btn[aria-current="page"] {
    color: var(--navy-deep);
    font-weight: 700;
    background: var(--navy-soft);
  }

  /* ===== Page transitions ===== */
  .page { display: none; }
  .page.active { display: block; animation: fade-in .35s ease; }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { .page.active { animation: none; } }

  section.block { padding: 56px 24px; }
  .block-inner { max-width: 1080px; margin: 0 auto; }

  .eyebrow {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    text-transform: none;
    margin-bottom: 10px;
  }

  /* ===== Hero ===== */
  .hero {
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,0.18), transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(255,255,255,0.10), transparent 46%),
      var(--navy-deep);
    color: var(--on-navy);
    padding: 80px 24px 104px;
    position: relative;
    overflow: hidden;
    border-radius: 0 0 var(--radius-l) var(--radius-l);
  }
  .hero::before {
    content: "";
    position: absolute; inset: auto 0 0 0;
    height: 8px; background: var(--gold);
    transform: translateY(50%);
  }
  .hero-inner {
    max-width: 880px;
    margin: 0 auto;
    position: relative;
    text-align: center;
  }
  .hero .eyebrow { color: #f3d9c5; }
  .hero h1 {
    font-size: clamp(1.6rem, 2.6vw + 1rem, 2.4rem);
    line-height: 1.55;
    color: var(--on-navy);
  }
  .hero .subtitle {
    margin-top: 14px;
    font-size: 1.05rem;
    color: #e6d3c5;
  }
  .hero .tagline {
    margin-top: 28px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 0.86rem;
    color: var(--on-navy);
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.28);
    padding: 8px 18px;
    border-radius: 999px;
  }
  .hero-meta {
    margin-top: 20px;
    font-size: 0.8rem;
    color: #f3d9c5;
    display: flex; justify-content: center; gap: 18px; flex-wrap: wrap;
  }

  /* ===== Intro ===== */
  .lede { max-width: 68ch; color: var(--ink-soft); font-size: 0.98rem; }
  .block-title { font-size: 1.3rem; margin-bottom: 14px; }

  /* ===== Pillars ===== */
  .pillars {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 32px;
  }
  .pillar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-l);
    padding: 26px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .pillar-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .pillar-icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  .pillar-card.-green .pillar-icon { background: var(--green-soft); color: var(--green); }
  .pillar-card.-gold  .pillar-icon { background: var(--gold-soft); color: var(--gold); }
  .pillar-card.-teal  .pillar-icon { background: var(--teal-soft); color: var(--teal); }
  .pillar-card h3 { font-size: 1.1rem; }
  .pillar-card p { margin: 0; color: var(--ink-soft); font-size: 0.92rem; flex: 1; }
  .pillar-link {
    align-self: flex-start;
    font-size: 0.86rem;
    font-weight: 700;
    text-decoration: none;
    border: none;
    background: none;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .pillar-card.-green .pillar-link { color: var(--green); }
  .pillar-card.-gold  .pillar-link { color: var(--gold); }
  .pillar-card.-teal  .pillar-link { color: var(--teal); }

  /* ===== Timeline ===== */
  .timeline-scroll {
    overflow-x: auto;
    margin-top: 32px;
    padding: 4px 4px 14px;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
  .timeline {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(260px, 1fr);
    gap: 20px;
    min-width: min-content;
  }
  .timeline-year {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-l);
    padding: 22px;
  }
  .timeline-year h3 {
    font-size: 0.95rem;
    color: var(--navy);
    display: flex; align-items: baseline; gap: 8px;
  }
  .timeline-year .year-no {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 1.6rem;
    font-variant-numeric: tabular-nums;
  }
  .timeline-year ul { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .timeline-year li {
    font-size: 0.88rem;
    color: var(--ink-soft);
    padding-left: 16px;
    position: relative;
  }
  .timeline-year li::before {
    content: ""; position: absolute; left: 0; top: 0.55em;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--navy);
  }

  /* ===== Theme accent scopes ===== */
  #page-group                              { --accent: var(--green);  --accent-soft: var(--green-soft); }
  #page-lesson                             { --accent: var(--gold);   --accent-soft: var(--gold-soft); }
  #page-ict                                { --accent: var(--teal);   --accent-soft: var(--teal-soft); }
  #page-grades,
  #page-grade-1, #page-grade-2, #page-grade-3, #page-grade-4,
  #page-grade-5, #page-grade-6, #page-grade-sn {
    --accent: var(--navy); --accent-soft: var(--navy-soft);
  }
  #page-dx, #page-dx-lesson, #page-dx-affairs {
    --accent: var(--purple); --accent-soft: var(--purple-soft);
  }
  .pillar-card.-purple .pillar-icon { background: var(--purple-soft); color: var(--purple); }
  .pillar-card.-purple .pillar-link { color: var(--purple); }

  /* ===== Grade index cards ===== */
  .grade-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 32px;
  }
  .grade-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-l);
    padding: 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .grade-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .grade-card .grade-no {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid; place-items: center;
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
  }
  .grade-card h3 { font-size: 1.04rem; }
  .grade-card p { margin: 0; color: var(--ink-soft); font-size: 0.9rem; flex: 1; }
  .grade-card .grade-link {
    align-self: flex-start;
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--accent);
    background: none; border: none; font-family: inherit; cursor: pointer; padding: 0;
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 28px;
  }

  /* ===== Chips ===== */
  .chip-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .chip {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 700;
  }

  /* ===== App cards ===== */
  .app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 28px;
  }
  .app-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    padding: 20px;
    display: flex;
    gap: 14px;
    box-shadow: var(--shadow);
  }
  .app-icon {
    flex: none;
    width: 48px; height: 48px;
    border-radius: var(--radius-s);
    background: var(--accent-soft);
    color: var(--accent);
    display: grid; place-items: center;
  }
  .app-icon svg { width: 24px; height: 24px; }
  .app-body h3 { font-size: 0.98rem; margin-bottom: 4px; }
  .app-tag {
    display: inline-block;
    font-size: 0.66rem;
    color: var(--ink-soft);
    background: var(--surface-alt);
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .app-body p { margin: 0; font-size: 0.86rem; color: var(--ink-soft); }
  .app-note {
    margin-top: 16px;
    font-size: 0.8rem;
    color: var(--ink-faint);
  }

  /* ===== Page banner (subpages) ===== */
  .page-banner {
    background: var(--accent-soft);
    padding: 40px 24px 36px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .page-banner::before {
    content: "";
    position: absolute; left: 0; right: 0; bottom: -1px;
    height: 4px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
  }
  .page-banner .eyebrow { color: var(--accent); }
  .breadcrumb {
    max-width: 1080px;
    margin: 0 auto 14px;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .breadcrumb button {
    background: none; border: none; padding: 0; font: inherit;
    color: var(--accent); font-weight: 700; cursor: pointer;
  }
  .breadcrumb button:focus-visible { outline-offset: 0; border-radius: 4px; }
  .page-banner-inner { max-width: 1080px; margin: 0 auto; }
  .page-banner h1 {
    font-size: clamp(1.4rem, 1.6vw + 1rem, 1.95rem);
    color: var(--ink);
  }
  .page-banner .subtitle {
    margin-top: 10px;
    color: var(--ink-soft);
    font-size: 0.96rem;
    max-width: 62ch;
  }

  h2.section-title {
    font-size: 1.4rem;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  h2.section-title .section-tag {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 11px;
    border-radius: 999px;
  }

  /* ===== Practice grid ===== */
  .practice-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
    margin-top: 28px;
  }
  .practice-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .practice-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

  .photo-placeholder {
    aspect-ratio: 4 / 3;
    background:
      repeating-linear-gradient(45deg, var(--surface-alt) 0 10px, var(--bg) 10px 20px);
    display: grid;
    place-items: center;
    color: var(--ink-soft);
    font-size: 0.82rem;
    gap: 6px;
    border-bottom: 1px solid var(--border);
  }
  .photo-placeholder svg { width: 30px; height: 30px; opacity: 0.75; }

  .practice-body {
    padding: 18px 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .grade-tag {
    align-self: flex-start;
    font-size: 0.72rem;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 700;
  }
  .practice-body h3 { font-size: 1.02rem; }
  .practice-body p { margin: 0; font-size: 0.88rem; color: var(--ink-soft); flex: 1; }

  /* ===== Outcome cards ===== */
  .outcome-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
    margin-top: 28px;
  }
  .outcome-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    padding: 22px 24px;
  }
  .outcome-card h3 {
    font-size: 0.98rem;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.-good  { background: var(--green); }
  .dot.-issue { background: var(--gold);  }
  .outcome-card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .outcome-card li {
    font-size: 0.88rem;
    color: var(--ink-soft);
    padding-left: 16px;
    position: relative;
  }
  .outcome-card li::before {
    content: ""; position: absolute; left: 0; top: 0.55em;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-faint);
  }

  .back-to-top {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 40px;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--navy);
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    min-height: 44px;
  }
  .back-to-top:hover { background: var(--surface-alt); }

  .surface-alt-bg { background: var(--surface-alt); }

  /* ===== Responsive ===== */
  @media (max-width: 900px) {
    .pillars, .grade-grid, .outcome-grid { gap: 16px; }
    .timeline { grid-auto-columns: 240px; }
    .hero { padding: 60px 20px 80px; }
    section.block { padding: 44px 20px; }
  }

  @media (max-width: 720px) {
    .nav-toggle { display: inline-flex; }
    .header-bar { padding: 10px 16px; }
    .main-nav {
      display: none;
      position: absolute;
      top: 100%;
      left: 12px; right: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      margin-top: 6px;
      box-shadow: var(--shadow);
      flex-direction: column;
      gap: 4px;
      z-index: 60;
    }
    body.nav-open .main-nav { display: flex; }
    .nav-btn { width: 100%; justify-content: flex-start; }

    .timeline { grid-auto-columns: 220px; }

    .hero { padding: 48px 18px 64px; }
    .hero h1 { font-size: 1.45rem; }
    section.block { padding: 36px 18px; }

<script type="module">
  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  /* ============================================================
     ここを、あなたのFirebaseプロジェクトの設定値に書き換えてください。
     Firebaseコンソール →「プロジェクトの設定」→「全般」→
     「マイアプリ」→ ウェブアプリ(</>) を追加すると表示されます。
     ============================================================ */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDQFsxMFKsIFd-CU-Izd3vGEqx5u-IBJG4",
    authDomain: "nishihara2026-402f0.firebaseapp.com",
    projectId: "nishihara2026-402f0",
    storageBucket: "nishihara2026-402f0.firebasestorage.app",
    messagingSenderId: "409206212669",
    appId: "1:409206212669:web:3eb16a58d58f99c423c254"
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const CONTENT_DOC = doc(db, 'site', 'content');

  const EDITABLE_SELECTOR = [
    'h1', '.subtitle', '.tagline', '.lede', '.eyebrow', '.block-title',
    '.pillar-card h3', '.pillar-card p', '.chip',
    '.grade-card h3', '.grade-card p',
    '.practice-body h3', '.practice-body p', '.grade-tag',
    '.app-body h3', '.app-body p', '.app-tag', '.app-note',
    '.timeline-year li', '.outcome-card li'
  ].join(',');

  let STATE = {};
  try {
    STATE = JSON.parse(document.getElementById('content-data').textContent || '{}') || {};
  } catch (e) { STATE = {}; }

  const appRoot = document.getElementById('app-root');
  const bodyTemplate = document.getElementById('body-template');
  let currentPage = 'home';
  let isEditing = false;
  let isLoggedIn = false;

  function applyState(root) {
    // ページ単位でキーを振る（ページを増やしても既存ページ・フッターの
    // 保存済み内容がズレないようにするための仕組み）
    root.querySelectorAll('.page').forEach((pageEl) => {
      const scope = pageEl.id.replace(/^page-/, '');
      pageEl.querySelectorAll(EDITABLE_SELECTOR).forEach((el, i) => {
        const key = scope + '::' + i;
        el.dataset.k = key;
        if (Object.prototype.hasOwnProperty.call(STATE, key)) {
          el.textContent = STATE[key];
        }
      });
    });
  }

  function mount() {
    appRoot.innerHTML = '';
    const frag = bodyTemplate.content.cloneNode(true);
    applyState(frag);
    appRoot.appendChild(frag);
    wireNav();
    gotoPage(currentPage);
  }

  function wireNav() {
    const navMap = {
      home: 'nav-home', group: 'nav-group', lesson: 'nav-lesson', ict: 'nav-ict',
      dx: 'nav-dx', 'dx-lesson': 'nav-dx', 'dx-affairs': 'nav-dx',
      grades: 'nav-grades',
      'grade-1': 'nav-grades', 'grade-2': 'nav-grades', 'grade-3': 'nav-grades',
      'grade-4': 'nav-grades', 'grade-5': 'nav-grades', 'grade-6': 'nav-grades',
      'grade-sn': 'nav-grades'
    };
    window.gotoPage = function (name) {
      currentPage = name;
      document.querySelectorAll('.page').forEach((el) => {
        el.classList.toggle('active', el.id === 'page-' + name);
      });
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.removeAttribute('aria-current');
      });
      if (navMap[name]) {
        const btn = document.getElementById(navMap[name]);
        if (btn) btn.setAttribute('aria-current', 'page');
      }
      window.scrollTo({ top: 0, behavior: 'auto' });
      document.body.classList.remove('nav-open');
      const t = document.getElementById('nav-toggle-btn');
      if (t) t.setAttribute('aria-expanded', 'false');
    };
  }

  async function loadFromFirestore() {
    try {
      const snap = await getDoc(CONTENT_DOC);
      if (snap.exists()) {
        const data = snap.data();
        if (data && data.state) {
          STATE = data.state;
          mount();
        }
      }
    } catch (e) {
      console.warn('Firestoreからの読み込みに失敗しました', e);
    }
  }

  function wireEditing() {
    const toolbar = document.getElementById('edit-toolbar');
    const statusEl = document.getElementById('edit-status');
    const loginBtn = document.getElementById('login-btn');
    const loginForm = document.getElementById('login-form');
    const loginEmail = document.getElementById('login-email');
    const loginPassword = document.getElementById('login-password');
    const loginSubmit = document.getElementById('login-submit');
    const loginCancel = document.getElementById('login-cancel');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');
    const toggleBtn = document.getElementById('edit-toggle');
    const saveBtn = document.getElementById('edit-save');

    function setStatus(text) { statusEl.textContent = text || ''; }

    function renderAuthUI(loggedIn) {
      isLoggedIn = loggedIn;
      loginBtn.hidden = loggedIn;
      loginForm.hidden = true;
      logoutBtn.hidden = !loggedIn;
      toggleBtn.hidden = !loggedIn;
      if (!loggedIn) {
        isEditing = false;
        document.body.classList.remove('editing');
        saveBtn.hidden = true;
        toggleBtn.setAttribute('aria-pressed', 'false');
        toggleBtn.textContent = '編集する';
        setStatus('');
      }
    }

    loginBtn.addEventListener('click', () => {
      loginForm.hidden = false;
      loginBtn.hidden = true;
      loginError.textContent = '';
    });
    loginCancel.addEventListener('click', () => {
      loginForm.hidden = true;
      loginBtn.hidden = false;
      loginError.textContent = '';
    });
    loginSubmit.addEventListener('click', async () => {
      loginError.textContent = '';
      loginSubmit.disabled = true;
      try {
        await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
        loginForm.hidden = true;
        loginPassword.value = '';
      } catch (e) {
        loginError.textContent = 'ログインできませんでした。IDとパスワードをご確認ください。';
      } finally {
        loginSubmit.disabled = false;
      }
    });
    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => renderAuthUI(!!user));

    toggleBtn.addEventListener('click', () => {
      isEditing = !isEditing;
      document.body.classList.toggle('editing', isEditing);
      toggleBtn.setAttribute('aria-pressed', String(isEditing));
      toggleBtn.textContent = isEditing ? '編集を終える' : '編集する';
      saveBtn.hidden = !isEditing;
      setStatus(isEditing ? 'クリックして編集できます' : '');
    });

    appRoot.addEventListener('click', (e) => {
      if (!isEditing) return;
      const el = e.target.closest('[data-k]');
      if (!el || el.isContentEditable) return;
      startEdit(el);
    });

    function startEdit(el) {
      el.contentEditable = 'plaintext-only';
      if (el.contentEditable !== 'plaintext-only') {
        el.contentEditable = 'true';
      }
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      function commit() {
        el.contentEditable = 'false';
        el.removeEventListener('blur', commit);
        el.removeEventListener('keydown', onKeydown);
        const text = el.textContent.replace(/\s+/g, ' ').trim();
        el.textContent = text;
        STATE[el.dataset.k] = text;
      }
      function onKeydown(ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); el.blur(); }
        else if (ev.key === 'Escape') { ev.preventDefault(); el.blur(); }
      }
      el.addEventListener('blur', commit);
      el.addEventListener('keydown', onKeydown);
    }

    saveBtn.addEventListener('click', async () => {
      if (!isLoggedIn) return;
      const active = document.activeElement;
      if (active && active.isContentEditable) active.blur();
      saveBtn.disabled = true;
      setStatus('保存しています…');
      try {
        await setDoc(CONTENT_DOC, { state: STATE, updatedAt: serverTimestamp() });
        setStatus('保存しました');
      } catch (e) {
        setStatus('保存に失敗しました。ログイン状態をご確認ください。');
      } finally {
        saveBtn.disabled = false;
      }
    });
  }

  function startApp() {
    mount();
    wireEditing();
    loadFromFirestore();
  }

  const GATE_PASSWORD = 'ohtawara';
  const GATE_KEY = 'nishihara_site_unlocked';

  function initGate() {
    const overlay = document.getElementById('gate-overlay');
    const input = document.getElementById('gate-password');
    const submitBtn = document.getElementById('gate-submit');
    const errorEl = document.getElementById('gate-error');

    let already = false;
    try { already = localStorage.getItem(GATE_KEY) === 'yes'; } catch (e) {}

    if (already) {
      overlay.hidden = true;
      startApp();
      return;
    }

    function tryUnlock() {
      if (input.value === GATE_PASSWORD) {
        overlay.hidden = true;
        try { localStorage.setItem(GATE_KEY, 'yes'); } catch (e) {}
        startApp();
      } else {
        errorEl.textContent = 'パスワードが違います。';
        input.value = '';
        input.focus();
      }
    }

    submitBtn.addEventListener('click', tryUnlock);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); tryUnlock(); }
    });
    input.focus();
  }

  initGate();
</script>
</body>
